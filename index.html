
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Juanma Fernández | Software Developer & Systems Tech</title>
    <meta name="description" content="Portfolio de Juan Manuel Fernández Rodríguez — Técnico SMR, estudiante de DAM y desarrollador. Proyectos, trayectoria y contacto." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <meta name="theme-color" content="#050505" id="theme-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            screens: {
              'tablet': {'min': '768px', 'max': '1023px'},
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @media (min-width: 1024px) {
        body, a, button, input, textarea, .cursor-pointer, .cursor-text, [contenteditable="true"] {
          cursor: none !important;
        }
      }

      html {
        overflow-x: hidden;
        background-color: #fafafa;
      }
      
      html.dark {
        background-color: #050505;
      }

      body {
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        touch-action: pan-y;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
      }
      
      .gradient-text {
        background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: gradient-flow 8s ease infinite;
      }
      
      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
      }

      .section-fade {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      
      .section-fade.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes timeline-flow {
        0%   { background-position: 0% 0%;   }
        100% { background-position: 0% 100%; }
      }

      @keyframes timeline-draw {
        from { clip-path: inset(100% 0 0 0); }
        to   { clip-path: inset(0%   0 0 0); }
      }

      .timeline-fill {
        clip-path: inset(100% 0 0 0);
        background: linear-gradient(to bottom, #14b8a6, #8b5cf6, #14b8a6);
        background-size: 100% 200%;
      }

      .timeline-fill--active {
        animation:
          timeline-flow  4s    linear       infinite,
          timeline-draw  1.8s  ease-in-out  forwards;
      }

      @keyframes cert-shine {
        0%   { transform: translateX(-180%) skewX(-18deg); opacity: 0; }
        18%  { opacity: 1; }
        82%  { opacity: 1; }
        100% { transform: translateX(500%) skewX(-18deg); opacity: 0; }
      }

      .cert-shine-layer {
        position: absolute;
        top: -20%;
        left: 0;
        width: 22%;
        height: 140%;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 50%,
          transparent 100%
        );
        transform: translateX(-180%) skewX(-18deg);
        opacity: 0;
        /* no forwards — resets invisibly after completing so each hover replays */
      }

      .cert-card:hover {
        transform: translateY(-3px);
      }

      .cert-card:hover .cert-shine-layer {
        animation: cert-shine 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      ::-webkit-scrollbar { width: 4px; }
      .dark ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }

      .custom-cursor {
        width: 20px;
        height: 20px;
        border: 1.5px solid rgba(128, 128, 128, 0.5);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 2147483647;
        transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1), background 0.3s ease, border-color 0.3s ease, opacity 0.3s ease, border-radius 0.3s ease, width 0.3s ease;
        mix-blend-mode: normal;
        transform: scale(1);
        background: rgba(128, 128, 128, 0.1);
      }

      @media (min-width: 1024px) {
        .link-hover .custom-cursor {
          transform: scale(3.5);
          background: rgba(255, 255, 255, 1);
          border-color: transparent;
          mix-blend-mode: difference;
        }

        .cursor-clicking .custom-cursor {
          transform: scale(0.7);
        }
        .link-hover.cursor-clicking .custom-cursor {
          transform: scale(2.8);
        }

        .safe-hover .custom-cursor {
          mix-blend-mode: normal !important;
          background: rgba(255, 255, 255, 0.9) !important;
          border: 1px solid rgba(0, 0, 0, 0.2) !important;
        }

        .cursor-hidden-active .custom-cursor {
          opacity: 0 !important;
          transform: scale(0) !important;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-neutral-50 dark:bg-[#050505] text-neutral-900 dark:text-neutral-200 transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const cursor = document.createElement('div');
      cursor.className = 'custom-cursor hidden lg:block';
      cursor.setAttribute('aria-hidden', 'true');
      document.body.appendChild(cursor);

      document.addEventListener('mousemove', (e) => {
        if (window.innerWidth >= 1024) {
          requestAnimationFrame(() => {
            cursor.style.left = e.clientX - (cursor.offsetWidth / 2) + 'px';
            cursor.style.top = e.clientY - (cursor.offsetHeight / 2) + 'px';
          });
        }
      });

      document.addEventListener('mousedown', () => {
        if (window.innerWidth >= 1024) document.body.classList.add('cursor-clicking');
      });
      document.addEventListener('mouseup', () => {
        if (window.innerWidth >= 1024) document.body.classList.remove('cursor-clicking');
      });

      const handleHover = () => { if (window.innerWidth >= 1024) document.body.classList.add('link-hover'); };
      const handleUnhover = () => { if (window.innerWidth >= 1024) document.body.classList.remove('link-hover'); };
      
      const handleSafeHover = () => { if (window.innerWidth >= 1024) document.body.classList.add('safe-hover'); };
      const handleSafeUnhover = () => { if (window.innerWidth >= 1024) document.body.classList.remove('safe-hover'); };

      const handleHideHover = () => { if (window.innerWidth >= 1024) document.body.classList.add('cursor-hidden-active'); };
      const handleHideUnhover = () => { if (window.innerWidth >= 1024) document.body.classList.remove('cursor-hidden-active'); };

      const addListeners = () => {
        document.querySelectorAll('a:not(.cursor-safe):not(.cursor-hide):not(.no-cursor-effect), .cursor-pointer:not(button):not(input):not(textarea):not(.cursor-safe):not(.cursor-hide):not(.no-cursor-effect)').forEach(el => {
          if (el.dataset.cursorBound) return;
          el.addEventListener('mouseenter', handleHover);
          el.addEventListener('mouseleave', handleUnhover);
          el.dataset.cursorBound = "true";
        });

        document.querySelectorAll('.cursor-safe').forEach(el => {
          if (el.dataset.cursorBoundSafe) return;
          el.addEventListener('mouseenter', handleSafeHover);
          el.addEventListener('mouseleave', handleSafeUnhover);
          el.dataset.cursorBoundSafe = "true";
        });

        document.querySelectorAll('.cursor-hide').forEach(el => {
          if (el.dataset.cursorBoundHide) return;
          el.addEventListener('mouseenter', handleHideHover);
          el.addEventListener('mouseleave', handleHideUnhover);
          el.dataset.cursorBoundHide = "true";
        });
      };
      
      const observer = new MutationObserver(addListeners);
      observer.observe(document.body, { childList: true, subtree: true });
      addListeners();
    </script>
  </body>
</html>
